<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Emerald Arrow Gradient -->
    <linearGradient id="emeraldArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D084" />
      <stop offset="100%" stop-color="#05F29B" />
    </linearGradient>
  </defs>

  <!-- Solid #0F172A dark navy background -->
  <rect width="512" height="512" fill="#0F172A" />

  <!-- ================= EMBLEM ================= -->
  <!-- Centered Emblem icon scaled into top section -->
  <g transform="translate(148, 48) scale(1.02)">
    <!-- Swirl Arc 1: Thin light grey #94A3B8 -->
    <path 
      d="M 125 15 C 65 20, 20 68, 18 128 C 16 162, 32 192, 58 208 C 42 194, 34 168, 36 138 C 38 90, 75 42, 130 32 Z" 
      fill="#94A3B8"
      opacity="0.95"
    />
    
    <!-- Swirl Arc 2: Thin light grey #94A3B8 -->
    <path 
      d="M 148 24 C 95 38, 54 84, 52 142 C 50 178, 68 206, 96 218 C 76 204, 66 178, 68 148 C 71 106, 102 62, 152 42 Z" 
      fill="#94A3B8"
      opacity="0.85"
    />

    <!-- Swirl Arc 3: Thin light grey #94A3B8 -->
    <path 
      d="M 75 190 C 105 218, 155 224, 192 205 C 162 216, 118 210, 92 190 Z" 
      fill="#94A3B8"
      opacity="0.9"
    />

    <!-- Emerald #00D084 Soaring Arrow -->
    <path 
      d="M 5 168 C 35 174, 85 162, 122 118 C 142 94, 158 64, 168 38 L 140 46 L 195 2 L 202 68 L 176 54 C 166 82, 146 116, 118 144 C 78 184, 32 188, 5 168 Z" 
      fill="url(#emeraldArrow)"
    />

    <!-- White star highlight on arrow tip -->
    <path 
      d="M 172 38 Q 172 45, 178 45 Q 172 45, 172 52 Q 172 45, 166 45 Q 172 45, 172 38 Z" 
      fill="#FFFFFF"
    />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- EKALAVYA -->
  <text 
    x="256" 
    y="345" 
    text-anchor="middle"
    fill="#FFFFFF" 
    font-family="Cinzel, serif" 
    font-size="52" 
    font-weight="800" 
    letter-spacing="5"
  >
    EKALAVYA
  </text>

  <!-- CONSULTING -->
  <text 
    x="256" 
    y="410" 
    text-anchor="middle"
    fill="#FFFFFF" 
    font-family="sans-serif" 
    font-size="34" 
    font-weight="600" 
    letter-spacing="14"
  >
    CONSULTING
  </text>
</svg>
