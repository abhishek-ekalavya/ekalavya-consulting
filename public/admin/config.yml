backend:
  name: github
  repo: abhishek-ekalavya/ekalavya-consulting
  branch: main
  base_url: https://www.ekalavyaconsulting.com
  auth_endpoint: api/auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # ==========================================
  # CASE STUDIES (Directly bound to data/dossiers.json)
  # ==========================================
  - name: "case_studies_collection"
    label: "Case Studies"
    files:
      - name: "dossiers"
        label: "All Dossiers & Case Studies"
        file: "data/dossiers.json"
        fields:
          - label: "Case Studies Dossier List"
            name: "dossiers"
            widget: "list"
            summary: "{{fields.title}} ({{fields.status}})"
            fields:
              - label: "Index / ID"
                name: "id"
                widget: "string"

              - label: "Slug / URL Identifier"
                name: "slug"
                widget: "string"

              - label: "Brand Title"
                name: "title"
                widget: "string"

              - label: "Subtitle / Tagline"
                name: "subtitle"
                widget: "string"

              - label: "Status Badge"
                name: "status"
                widget: "string"

              - label: "Tags / Categories"
                name: "tags"
                widget: "list"
                field:
                  label: "Tag"
                  name: "tag"
                  widget: "string"

              # --- IMAGE SLIDER / CAROUSEL ---
              - label: "Hero Slider Images"
                name: "heroImages"
                widget: "list"
                hint: "Add, reorder, or upload images here. They will cycle in the hero slider on the case study page."
                field:
                  label: "Slide Image"
                  name: "image"
                  widget: "image"

              - label: "Context & Background"
                name: "context"
                widget: "text"

              - label: "The Challenge"
                name: "challenge"
                widget: "text"

              - label: "Core Concept & Strategy"
                name: "concept"
                widget: "text"

              - label: "Execution Milestones"
                name: "execution"
                widget: "list"
                field:
                  label: "Milestone Item"
                  name: "item"
                  widget: "text"

              # --- IMPACT / COMPARISON MATRIX ---
              - label: "Impact Comparison Matrix"
                name: "impactTable"
                widget: "object"
                fields:
                  - label: "Table Column Headers"
                    name: "headers"
                    widget: "list"
                    field:
                      label: "Header Name"
                      name: "header"
                      widget: "string"
                  - label: "Table Rows"
                    name: "rows"
                    widget: "list"
                    field:
                      label: "Row Cells (Dimension, Before, After)"
                      name: "row"
                      widget: "list"
                      field:
                        label: "Cell Text"
                        name: "cell"
                        widget: "string"

              - label: "The Ekalavya Advantage"
                name: "advantage"
                widget: "text"
