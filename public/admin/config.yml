backend:
  name: github
  repo: abhishek-ekalavya/ekalavya-consulting
  branch: main
  base_url: https://www.ekalavyaconsulting.com
  auth_endpoint: api/auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # ==========================================================
  # 1. CASE STUDIES (Folder Collection - 100% Stable)
  # ==========================================================
  - name: "case_studies"
    label: "Case Studies"
    folder: "content/case-studies"
    extension: "json"
    format: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Index / ID", name: "id", widget: "string" }
      - { label: "Slug / URL Identifier", name: "slug", widget: "string" }
      - { label: "Brand Title", name: "title", widget: "string" }
      - { label: "Featured on Homepage", name: "featured", widget: "boolean", default: false }
      - { label: "Outcome Metric", name: "outcome", widget: "string", required: false }
      - { label: "Subtitle / Tagline", name: "subtitle", widget: "string" }
      - { label: "Status Badge", name: "status", widget: "string" }
      - label: "Tags / Categories"
        name: "tags"
        widget: "list"
        required: false
      - label: "Hero Slider Images"
        name: "heroImages"
        widget: "list"
        required: false
        field: { label: "Slide Image", name: "image", widget: "image" }
      - { label: "Context & Background", name: "context", widget: "text" }
      - { label: "The Challenge", name: "challenge", widget: "text" }
      - { label: "Core Concept & Strategy", name: "concept", widget: "text" }
      - label: "Execution Milestones"
        name: "execution"
        widget: "list"
        required: false
      - { label: "The Ekalavya Advantage", name: "advantage", widget: "text" }

  # ==========================================================
  # 2. BLOGS
  # ==========================================================
  - name: "blogs"
    label: "Blogs"
    folder: "content/blogs"
    extension: "json"
    format: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Article Title", name: "title", widget: "string" }
      - { label: "Slug / URL Identifier", name: "slug", widget: "string" }
      - { label: "Category", name: "category", widget: "string", default: "GROWTH" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Short Description / Excerpt", name: "description", widget: "text" }
      - { label: "Featured Cover Image", name: "image", widget: "image", required: false }
      - { label: "Article Body (Markdown)", name: "body", widget: "markdown" }
      - label: "FAQ Schema Questions"
        name: "faq"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }

  # ==========================================================
  # 3. SETTINGS
  # ==========================================================
  - name: "settings"
    label: "Settings"
    files:
      - name: "general"
        label: "General Settings"
        file: "content/settings/general.json"
        fields:
          - { label: "Site Name", name: "site_name", widget: "string" }
          - { label: "Logo Text", name: "logo_text", widget: "string" }
          - { label: "Contact Email", name: "email", widget: "string" }
          - { label: "Phone Number", name: "phone", widget: "string" }
