backend:
  name: github
  repo: abhishek-ekalavya/ekalavya-consulting
  branch: main
  base_url: https://www.ekalavyaconsulting.com
  auth_endpoint: api/auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # ==========================================================
  # 1. CASE STUDIES (Bound to data/dossiers.json)
  # ==========================================================
  - name: "case_studies_collection"
    label: "Case Studies"
    files:
      - name: "dossiers"
        label: "All Dossiers & Case Studies"
        file: "data/dossiers.json"
        fields:
          - label: "Case Studies Dossier List"
            name: "dossiers"
            widget: "list"
            summary: "{{fields.title}} ({{fields.status}})"
            fields:
              - label: "Index / ID"
                name: "id"
                widget: "string"

              - label: "Slug / URL Identifier"
                name: "slug"
                widget: "string"

              - label: "Brand Title"
                name: "title"
                widget: "string"

              - label: "Subtitle / Tagline"
                name: "subtitle"
                widget: "string"

              - label: "Status Badge"
                name: "status"
                widget: "string"

              - label: "Tags / Categories"
                name: "tags"
                widget: "list"
                field:
                  label: "Tag"
                  name: "tag"
                  widget: "string"

              # --- HERO IMAGE SLIDER ---
              - label: "Hero Slider Images"
                name: "heroImages"
                widget: "list"
                hint: "Upload, reorder, or add multiple slides for the top carousel."
                field:
                  label: "Slide Image"
                  name: "image"
                  widget: "image"

              - label: "Context & Background"
                name: "context"
                widget: "text"

              - label: "The Challenge"
                name: "challenge"
                widget: "text"

              - label: "Core Concept & Strategy"
                name: "concept"
                widget: "text"

              - label: "Execution Milestones"
                name: "execution"
                widget: "list"
                field:
                  label: "Milestone Item"
                  name: "item"
                  widget: "text"

              # --- IMPACT / COMPARISON MATRIX ---
              - label: "Impact Comparison Matrix"
                name: "impactTable"
                widget: "object"
                fields:
                  - label: "Table Column Headers"
                    name: "headers"
                    widget: "list"
                    field:
                      label: "Header Name"
                      name: "header"
                      widget: "string"
                  - label: "Table Rows"
                    name: "rows"
                    widget: "list"
                    field:
                      label: "Row Cells (Dimension, Before, After)"
                      name: "row"
                      widget: "list"
                      field:
                        label: "Cell Text"
                        name: "cell"
                        widget: "string"

              - label: "The Ekalavya Advantage"
                name: "advantage"
                widget: "text"

  # ==========================================================
  # 2. BLOGS / INSIGHTS (With FAQ Schema & Multi-Image Support)
  # ==========================================================
  - name: "blogs"
    label: "Blogs"
    folder: "content/blogs"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Article Title"
        name: "title"
        widget: "string"

      - label: "Slug / URL Identifier"
        name: "slug"
        widget: "string"
        hint: "Example: fractional-cmo-vs-agency-guide"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"

      - label: "Author Name"
        name: "author"
        widget: "string"
        default: "Abhishek Bhowmick"

      - label: "Category / Tag"
        name: "category"
        widget: "string"
        default: "Marketing Strategy"

      - label: "Short Summary / Meta Description"
        name: "summary"
        widget: "text"
        hint: "Used for search engine snippets and social preview cards."

      # --- MULTIPLE IMAGE OPTIONS ---
      - label: "Primary Cover / Hero Image"
        name: "cover_image"
        widget: "image"
        required: false

      - label: "Additional Gallery / Article Images"
        name: "gallery_images"
        widget: "list"
        required: false
        hint: "Upload one, two, three, or more images for in-article visual showcases."
        field:
          label: "Image"
          name: "image"
          widget: "image"

      # --- MAIN BODY ---
      - label: "Article Body"
        name: "body"
        widget: "markdown"

      # --- FAQ SCHEMA ENGINE ---
      - label: "FAQ Schema Section"
        name: "faqs"
        widget: "list"
        required: false
        hint: "Add questions & answers here. These populate the FAQ accordion and power Google FAQ Schema (Schema.org/FAQPage)."
        fields:
          - label: "Question"
            name: "question"
            widget: "string"
          - label: "Answer"
            name: "answer"
            widget: "text"
