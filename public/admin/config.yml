backend:
  name: github
  repo: abhishek-ekalavya/ekalavya-consulting
  branch: main
  base_url: https://www.ekalavyaconsulting.com
  auth_endpoint: api/auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # ==========================================================
  # 1. CASE STUDIES
  # ==========================================================
  - name: "case_studies"
    label: "Case Studies"
    folder: "content/case-studies"
    extension: "json"
    format: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Index / ID", name: "id", widget: "string" }
      - { label: "Slug / URL Identifier", name: "slug", widget: "string" }
      - { label: "Brand Title", name: "title", widget: "string" }
      - { label: "Featured on Homepage", name: "featured", widget: "boolean", default: false }
      - { label: "Outcome Metric", name: "outcome", widget: "string", required: false }
      - { label: "Subtitle / Tagline", name: "subtitle", widget: "string" }
      - { label: "Status Badge", name: "status", widget: "string" }
      - label: "Tags / Categories"
        name: "tags"
        widget: "list"
        required: false
      - label: "Hero Slider Images"
        name: "heroImages"
        widget: "list"
        required: false
        field: { label: "Slide Image", name: "image", widget: "image" }
      - { label: "Context & Background", name: "context", widget: "text" }
      - { label: "The Challenge", name: "challenge", widget: "text" }
      - { label: "Core Concept & Strategy", name: "concept", widget: "text" }
      - label: "Execution Milestones"
        name: "execution"
        widget: "list"
        required: false
      - { label: "The Ekalavya Advantage", name: "advantage", widget: "text" }

  # ==========================================================
  # 2. BLOGS
  # ==========================================================
  - name: "blogs"
    label: "Blogs"
    folder: "content/blogs"
    extension: "json"
    format: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Article Title", name: "title", widget: "string" }
      - { label: "Slug / URL Identifier", name: "slug", widget: "string" }
      - { label: "Category", name: "category", widget: "string", default: "GROWTH" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Short Description / Excerpt", name: "description", widget: "text" }
      - { label: "Featured Cover Image", name: "image", widget: "image", required: false }
      - { label: "Article Body (Markdown)", name: "body", widget: "markdown" }
      - label: "FAQ Schema Questions"
        name: "faq"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }

  # ==========================================================
  # 3. PAGES
  # ==========================================================
  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home Page"
        file: "content/pages/home.json"
        fields:
          - { label: "Hero Badge", name: "hero_badge", widget: "string" }
          - { label: "Hero Headline", name: "hero_headline", widget: "text" }
          - { label: "Hero Sub-headline", name: "hero_sub", widget: "text" }
          - { label: "Tagline (One Arrow...)", name: "about_title", widget: "string" }
          - { label: "Primary CTA Button Text", name: "hero_cta", widget: "string" }
          - { label: "Explore Arsenal Button Text", name: "explore_arsenal_cta", widget: "string" }
          - label: "Founder Section (Homepage)"
            name: "founder_section"
            widget: "object"
            fields:
              - { label: "Top Label", name: "badge", widget: "string" }
              - { label: "Founder Name", name: "name", widget: "string" }
              - { label: "Founder Photo", name: "image", widget: "image", required: false }
              - label: "Bio Paragraphs"
                name: "bio_paragraphs"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }
              - { label: "Quote", name: "quote", widget: "text" }
          - label: "Infographics (Shared with Services Page)"
            name: "infographics"
            widget: "object"
            fields:
              - { label: "Challenge Infographic Image", name: "challenge_image", widget: "image" }
              - { label: "Challenge Image Alt Text", name: "challenge_alt", widget: "string" }
              - { label: "Answer Infographic Image", name: "answer_image", widget: "image" }
              - { label: "Answer Image Alt Text", name: "answer_alt", widget: "string" }
          - label: "How We Work (Shared with Services Page)"
            name: "how_we_work"
            widget: "object"
            fields:
              - { label: "Section Title", name: "title", widget: "string" }
              - { label: "Section Subtitle", name: "subtitle", widget: "text" }
              - label: "Path 1 - The Long Game"
                name: "path1"
                widget: "object"
                fields:
                  - { label: "Top Label", name: "label", widget: "string" }
                  - { label: "Card Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "List Heading", name: "list_heading", widget: "string" }
                  - label: "Bullet Points"
                    name: "items"
                    widget: "list"
                    field: { label: "Point", name: "item", widget: "string" }
                  - { label: "Best For Label", name: "best_for_label", widget: "string" }
                  - { label: "Best For Text", name: "best_for_text", widget: "text" }
              - label: "Path 2 - The Short Game"
                name: "path2"
                widget: "object"
                fields:
                  - { label: "Top Label", name: "label", widget: "string" }
                  - { label: "Card Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "List Heading", name: "list_heading", widget: "string" }
                  - label: "Execution Categories"
                    name: "categories"
                    widget: "list"
                    fields:
                      - { label: "Category Title", name: "title", widget: "string" }
                      - label: "Items"
                        name: "items"
                        widget: "list"
                        field: { label: "Item", name: "item", widget: "string" }
                  - { label: "Best For Label", name: "best_for_label", widget: "string" }
                  - { label: "Best For Text", name: "best_for_text", widget: "text" }
              - label: "Path 3 - The Smart Game"
                name: "path3"
                widget: "object"
                fields:
                  - { label: "Top Label", name: "label", widget: "string" }
                  - { label: "Card Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "List Heading", name: "list_heading", widget: "string" }
                  - label: "Automation Categories"
                    name: "categories"
                    widget: "list"
                    fields:
                      - { label: "Category Title", name: "title", widget: "string" }
                      - label: "Items"
                        name: "items"
                        widget: "list"
                        field: { label: "Item", name: "item", widget: "string" }
                  - { label: "Best For Label", name: "best_for_label", widget: "string" }
                  - { label: "Best For Text", name: "best_for_text", widget: "text" }
              - { label: "Closing Line Above CTA", name: "closing_line", widget: "text" }
          - label: "Proof of Precision Header"
            name: "proof_of_precision"
            widget: "object"
            fields:
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
          - label: "Clearing The Fog (Q&A Accordion)"
            name: "clearing_the_fog"
            widget: "object"
            fields:
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - label: "Q&A Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Question / Statement", name: "question", widget: "text" }
                  - { label: "Answer", name: "answer", widget: "text" }
          - label: "Engagement Battle Section"
            name: "engagement_battle"
            widget: "object"
            fields:
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - label: "Card A (Long Game)"
                name: "card_a"
                widget: "object"
                fields:
                  - { label: "Top Label", name: "label", widget: "string" }
                  - { label: "Card Title", name: "title", widget: "string" }
                  - label: "Checkpoints"
                    name: "points"
                    widget: "list"
                    field: { label: "Point", name: "point", widget: "string" }
                  - { label: "Button Text", name: "cta", widget: "string" }
              - label: "Card B (Short Game)"
                name: "card_b"
                widget: "object"
                fields:
                  - { label: "Top Label", name: "label", widget: "string" }
                  - { label: "Card Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Button Text", name: "cta", widget: "string" }

      - name: "about"
        label: "About Us"
        file: "content/pages/about.json"
        fields:
          - { label: "Breadcrumb Tag", name: "breadcrumb", widget: "string" }
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Opening Line", name: "intro_line", widget: "string" }
          - { label: "Bold Lead Sentence", name: "highlight_bold", widget: "text" }
          - { label: "Supporting Sentence", name: "highlight_text", widget: "text" }
          - label: "Body Paragraphs"
            name: "paragraphs"
            widget: "list"
            field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Button Text", name: "cta_text", widget: "string" }
          - { label: "Subtext Below Button", name: "cta_subtext", widget: "string" }

      - name: "team"
        label: "Our Team"
        file: "content/pages/team.json"
        fields:
          - { label: "Breadcrumb Tag", name: "breadcrumb", widget: "string", required: false, default: "02 • COMMAND LEADERSHIP" }
          - { label: "Page Title", name: "page_title", widget: "string", required: false, default: "Our Team" }
          - { label: "Page Intro Description", name: "intro", widget: "text", required: false, default: "No junior account managers or layers of agency coordinators. You work directly with senior marketers and hands-on specialists who have spent over two decades building 360° campaigns and brand growth across global markets." }
          - { label: "Founder Dossier Pill", name: "founder_pill", widget: "string", required: false, default: "01 • COMMAND • FOUNDER'S DOSSIER" }
          - { label: "Show Surgical Strike Team Card", name: "show_strike_team", widget: "boolean", default: false }
          - label: "Founder Dossier"
            name: "founder"
            widget: "object"
            fields:
              - { label: "Founder Name", name: "name", widget: "string" }
              - { label: "Title / Role", name: "title", widget: "string" }
              - { label: "Founder Photo", name: "image", widget: "image", required: false }
              - label: "Bio Paragraphs"
                name: "bio_paragraphs"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }
              - { label: "Founder Quote", name: "quote", widget: "text", required: false }
              - label: "Stat Pills"
                name: "stats"
                widget: "list"
                field: { label: "Stat Pill", name: "stat", widget: "string" }
          - label: "Fractional CMO Council Card"
            name: "council"
            widget: "object"
            fields:
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Unit / Subtitle", name: "unit", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Surgical Strike Team Card"
            name: "strike_team"
            widget: "object"
            fields:
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Unit / Subtitle", name: "unit", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
