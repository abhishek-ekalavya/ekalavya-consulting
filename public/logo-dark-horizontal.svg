<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 230" width="1100" height="230">
  <rect width="1100" height="230" fill="#071428" />

  <!-- ================= EC SHIELD EMBLEM ================= -->
  <g id="ec-shield-emblem" transform="translate(40, 15)">
    <!-- Top-Left Crest & Top Bar of E -->
    <path d="M 42 36 L 105 12 L 105 34 L 42 56 Z" fill="#FFFFFF" />
    
    <!-- Top-Right Crest -->
    <path d="M 105 12 L 168 36 L 168 56 L 105 34 Z" fill="#FFFFFF" />

    <!-- Left Outer Spine (Vertical of E / Left Wall of Shield) -->
    <path d="M 20 44 L 42 36 L 42 164 L 20 156 Z" fill="#FFFFFF" />

    <!-- Middle Bar of E -->
    <path d="M 42 89 L 88 89 L 88 111 L 42 111 Z" fill="#FFFFFF" />

    <!-- Bottom-Left Base & Bottom Bar of E -->
    <path d="M 42 144 L 105 166 L 105 188 L 42 164 Z" fill="#FFFFFF" />

    <!-- Bottom-Right Base -->
    <path d="M 105 166 L 168 144 L 168 164 L 105 188 Z" fill="#FFFFFF" />

    <!-- Right Outer Wall of Shield (Right Spine of C) -->
    <path d="M 168 36 L 190 44 L 190 156 L 168 164 Z" fill="#FFFFFF" />

    <!-- Geometric Intertwined C -->
    <!-- C Top Horizontal Arm -->
    <path d="M 168 56 L 105 56 L 90 70 L 104 84 L 146 84 L 146 116 L 168 116 Z" fill="#FFFFFF" opacity="0" /> <!-- spacer -->
    
    <!-- C Main Body: Top arm, inner curve, bottom arm -->
    <path d="M 168 60 L 115 60 L 98 76 L 98 124 L 115 140 L 168 140 L 168 118 L 126 118 L 120 112 L 120 88 L 126 82 L 168 82 Z" fill="#FFFFFF" />
    
    <!-- C 3D Inner Bevel / Fold Accent in Light Silver -->
    <path d="M 98 76 L 120 88 L 120 112 L 98 124 Z" fill="#CBD5E1" />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- EKALAVYA -->
  <text 
    x="272" 
