    fill="#FFFFFF" 
    font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="88" 
    font-weight="800" 
    letter-spacing="6.5"
  >EKALAVYA</text>

  <!-- CONSULTING -->
  <text 
    x="276" 
    y="175" 
    fill="#FFFFFF" 
    font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="33" 
