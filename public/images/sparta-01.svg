<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8FA3B8" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#sky)" />
  <!-- Distant vegetation & clouds -->
  <path d="M 0 550 L 1200 550 L 1200 800 L 0 800 Z" fill="#1E293B" />
  <!-- Building Body -->
  <path d="M 180 270 Q 420 120, 680 270 L 1020 270 L 1020 580 L 180 580 Z" fill="#475569" stroke="#1E293B" stroke-width="4" />
  <!-- Dome Roof Right -->
  <path d="M 680 270 Q 860 140, 1020 270 Z" fill="#E2E8F0" opacity="0.9" />
  <!-- Main Entrance / Red Architectural Frame -->
  <rect x="170" y="280" width="540" height="200" rx="6" fill="url(#glow)" />
  <rect x="190" y="300" width="500" height="160" fill="#0F172A" />
  <!-- Glass Windows with light -->
  <rect x="200" y="310" width="235" height="65" fill="#38BDF8" opacity="0.6" />
  <rect x="445" y="310" width="235" height="65" fill="#38BDF8" opacity="0.6" />
  <rect x="200" y="385" width="235" height="65" fill="#38BDF8" opacity="0.4" />
  <rect x="445" y="385" width="235" height="65" fill="#38BDF8" opacity="0.4" />
  <!-- Upper Signage: SPARTA LIFE -->
  <text x="440" y="240" fill="#FFFFFF" font-family="Cinzel, serif" font-size="42" font-weight="800" text-anchor="middle" letter-spacing="4">SPARTA LIFE</text>
  <text x="440" y="260" fill="#CBD5E1" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="5">SPORTS &amp; FITNESS ECOSYSTEM</text>
  <!-- Architectural Windows on Right Wing -->
  <rect x="720" y="310" width="130" height="40" rx="2" fill="#1E293B" stroke="#0F172A" stroke-width="6" />
  <rect x="720" y="390" width="130" height="40" rx="2" fill="#1E293B" stroke="#0F172A" stroke-width="6" />
  <rect x="880" y="460" width="120" height="90" rx="2" fill="#38BDF8" opacity="0.5" stroke="#0F172A" stroke-width="8" />
  <!-- Lower Windows & Entrance -->
  <rect x="260" y="500" width="65" height="75" fill="#9A3412" />
  <rect x="350" y="500" width="65" height="75" fill="#9A3412" />
  <rect x="470" y="500" width="65" height="75" fill="#9A3412" />
  <rect x="590" y="500" width="65" height="75" fill="#9A3412" />
  <!-- Foreground Perimeter Fence -->
  <path d="M 0 560 L 1200 560" stroke="#64748B" stroke-width="6" />
  <!-- Tarmac Road -->
  <rect x="0" y="580" width="1200" height="220" fill="url(#road)" />
  <!-- Tactical Watermark / Status Badge -->
  <rect x="40" y="40" width="280" height="36" rx="4" fill="#0F172A" stroke="#00D084" stroke-width="1.5" />
  <text x="55" y="63" fill="#00D084" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="2">FIGURE 01.01 // FACILITY VIEW</text>
</svg>