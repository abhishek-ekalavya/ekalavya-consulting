<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="50%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="marble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>
  <!-- Background Interior Wall -->
  <rect width="1200" height="800" fill="#0F172A" />
  <!-- Fluted Wood Paneling Feature Wall -->
  <rect x="250" y="0" width="700" height="580" fill="url(#wood)" stroke="#1E293B" stroke-width="4" />
  <!-- Vertical LED Accent Strips on paneling -->
  <line x1="290" y1="0" x2="290" y2="580" stroke="#FEF08A" stroke-width="6" opacity="0.85" />
  <line x1="320" y1="0" x2="320" y2="580" stroke="#FEF08A" stroke-width="4" opacity="0.7" />
  <line x1="880" y1="0" x2="880" y2="580" stroke="#FEF08A" stroke-width="4" opacity="0.7" />
  <line x1="910" y1="0" x2="910" y2="580" stroke="#FEF08A" stroke-width="6" opacity="0.85" />
  <!-- Hanging Modern Chandelier / Light Crystals -->
  <g fill="#BAE6FD" opacity="0.85">
    <rect x="400" y="60" width="8" height="50" />
    <rect x="430" y="50" width="8" height="65" />
    <rect x="460" y="55" width="8" height="60" />
    <rect x="490" y="45" width="8" height="75" />
    <rect x="520" y="60" width="8" height="55" />
    <rect x="550" y="50" width="8" height="70" />
    <rect x="580" y="55" width="8" height="60" />
    <rect x="610" y="45" width="8" height="75" />
    <rect x="640" y="60" width="8" height="50" />
    <rect x="670" y="50" width="8" height="65" />
    <rect x="700" y="55" width="8" height="60" />
    <rect x="730" y="60" width="8" height="55" />
  </g>
  <!-- SPARTA LIFE Reception Feature Crest Logo -->
  <g transform="translate(360, 240)">
    <path d="M 30 50 C 10 10, 80 -20, 140 -20 C 60 -10, 20 20, 20 70 C 20 110, 60 140, 130 140 C 60 130, 25 100, 30 50 Z" fill="#2563EB" opacity="0.9" />
    <path d="M 60 30 C 40 -10, 110 -30, 170 -30 C 90 -20, 50 10, 50 60 C 50 95, 80 120, 150 120 C 80 110, 45 80, 60 30 Z" fill="#DC2626" opacity="0.9" />
    <text x="200" y="65" fill="#FFFFFF" font-family="Cinzel, serif" font-size="64" font-weight="800" letter-spacing="4">SPARTA</text>
    <text x="340" y="110" fill="#FFFFFF" font-family="Cinzel, serif" font-size="42" font-weight="700" letter-spacing="6">LIFE</text>
    <text x="160" y="145" fill="#CBD5E1" font-family="sans-serif" font-size="14" font-weight="600" letter-spacing="4">SPORTS &amp; FITNESS ECOSYSTEM</text>
  </g>
  <!-- Backlit Onyx / Translucent Marble Reception Desk -->
  <rect x="160" y="540" width="880" height="200" rx="6" fill="url(#marble)" stroke="#92400E" stroke-width="4" />
  <!-- Glossy Countertop -->
  <rect x="150" y="530" width="900" height="20" rx="3" fill="#FFFFFF" opacity="0.9" />
  <!-- Reception Chairs -->
  <ellipse cx="320" cy="640" rx="45" ry="35" fill="#1E293B" stroke="#0F172A" stroke-width="4" />
  <ellipse cx="880" cy="640" rx="45" ry="35" fill="#1E293B" stroke="#0F172A" stroke-width="4" />
  <!-- Marble Flooring -->
  <rect x="0" y="730" width="1200" height="70" fill="#1E293B" opacity="0.8" />
  <!-- Tactical Watermark / Status Badge -->
  <rect x="40" y="40" width="290" height="36" rx="4" fill="#0F172A" stroke="#00D084" stroke-width="1.5" />
  <text x="55" y="63" fill="#00D084" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="2">FIGURE 01.02 // RECEPTION HUB</text>
</svg>